name: smart_wallet_app
description: "A professional Flutter project for Personal Finance Management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # المكتبات المطلوبة للمشروع:
  provider: ^6.1.1      # لإدارة الحالة (State Management)
  intl: ^0.19.0          # لتنسيق العملات والتواريخ
  uuid: ^4.4.0          # لتوليد معرفات (ID) فريدة للعمليات المالية

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true